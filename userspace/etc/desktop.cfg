# NtOS desktop configuration
# Format: NAME | EXEC | ICON | COLOR(0xRRGGBB)
# EXEC = "KERNEL://name" for built-in apps, or a path in the initrd (e.g. bin/hello.elf)
TERMINAL | KERNEL://terminal | >_ | 0x44FF88
TASKMAN  | KERNEL://taskman  | [] | 0xFF3333
EDITOR   | KERNEL://editor   | TXT | 0xFFAA00
DOOM     | bin/doom.elf      | III | 0xAA0000
